# Default configuration for the planar (2D) robot localization simulator.
# Every value here can be edited in the Streamlit sidebar or overridden in code.
# Units: metres, seconds, radians (unless a name says otherwise).

robot:
  wheel_radius: 0.05        # r [m]
  wheel_separation: 0.30    # b [m], distance between the two wheels
  initial_x: 0.0            # [m]
  initial_y: 0.0            # [m]
  initial_yaw: 0.0          # psi_0 [rad]

trajectory:
  name: square              # straight | square | circle | figure_eight | custom
  speed: 0.5                # forward speed on straight / circular parts [m/s]
  turn_rate: 0.5            # target yaw rate used for square corners [rad/s]
  side_length: 8.0          # square side [m]
  radius: 4.0               # circle radius / figure-eight loop radius [m]
  # Custom motion sequence: each segment commands constant v [m/s] and
  # omega [rad/s] for `duration` seconds. After the last segment the robot stops.
  custom_segments:
    - {duration: 10.0, v: 0.5, omega: 0.0}
    - {duration: 6.0,  v: 0.4, omega: 0.3}
    - {duration: 10.0, v: 0.5, omega: 0.0}
    - {duration: 6.0,  v: 0.4, omega: -0.3}

simulation:
  dt: 0.05                  # time step [s]
  duration: 80.0            # total simulated time [s]
  seed: 42                  # master random seed (reproducible runs)
  boundary_enabled: true    # draw the rectangular environment boundary
  boundary_xmin: -2.0
  boundary_xmax: 12.0
  boundary_ymin: -2.0
  boundary_ymax: 12.0

odometry:
  wheel_noise_std: 0.30     # Gaussian noise on each measured wheel speed [rad/s]
  scale_error: 0.01         # fractional encoder scale error on the right wheel (calibration error)

imu:
  enabled: true             # use gyro yaw rate for dead reckoning and EKF prediction
  gyro_noise_std: 0.01      # gyro white noise [rad/s]
  gyro_bias: 0.002          # initial gyro bias [rad/s]
  bias_random_walk_std: 0.0005  # slow bias variation [rad/s per sqrt(s)]
  heading_correction: false # optional EKF correction from a noisy IMU heading
  heading_noise_std: 0.05   # heading measurement noise [rad]
  heading_rate_hz: 2.0      # heading measurement rate [Hz]

gps:
  enabled: true
  noise_std: 0.5            # std of the global x / y position error [m]
  rate_hz: 1.0              # nominal fix rate [Hz]
  dropout_probability: 0.1  # probability that a scheduled fix is lost

ekf:
  integration: euler        # euler (as in the brief) | midpoint (second-order)
  q_pos: 0.05               # process noise on x, y   [m / sqrt(s)]   -> Q = diag(q^2) * dt
  q_yaw: 0.02               # process noise on psi    [rad / sqrt(s)]
  p0_pos_std: 0.1           # initial position std [m]
  p0_yaw_std: 0.05          # initial yaw std [rad]
  match_sensor_noise: true  # true: R is built from the GPS / heading sensor noise settings
  gps_r_std: 0.5            # GPS R std [m], used only if match_sensor_noise is false
  heading_r_std: 0.05       # heading R std [rad], used only if match_sensor_noise is false
